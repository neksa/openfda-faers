stages:
  download:
    desc: Fetch quarterly FAERS/LAERS archives from FDA and record SHA-256 checksums.
    cmd: python -m faers.cli download
    deps:
      - src/faers/download.py
      - src/faers/sources.py
    params:
      - coverage
    outs:
      - data/raw:
          # ~3.5 GB of archives that FDA already hosts permanently. Caching them in DVC would
          # double the disk cost for bytes that are re-fetchable, and the checksum manifest below
          # is what actually pins them.
          cache: false
          persist: true
      - results/source_manifest.json:
          cache: false

  harmonize:
    desc: Parse both eras into one canonical schema (LAERS 2004Q1-2012Q3, FAERS 2012Q4+).
    cmd: python -m faers.cli harmonize
    deps:
      - data/raw
      - src/faers/harmonize.py
      - src/faers/schema.py
      - src/faers/sources.py
    params:
      - coverage
    outs:
      - data/harmonized
      - results/harmonize_stats.json:
          cache: false

  dedup:
    desc: Collapse to one record per case; drop FDA-retracted cases and superseded versions.
    cmd: python -m faers.cli dedup
    deps:
      - data/harmonized
      - src/faers/dedup.py
    outs:
      - data/curated/demo.parquet
      - data/curated/surviving_records.parquet
      - data/curated/drug.parquet
      - data/curated/reac.parquet
      - data/curated/outc.parquet
      - data/curated/indi.parquet
      - data/curated/ther.parquet
      - data/curated/rpsr.parquet
    metrics:
      - results/dedup_stats.json:
          cache: false

  brands:
    desc: Build a brand-to-ingredient index from FDA's public-domain NDC directory.
    cmd: python -m faers.cli brands
    deps:
      - src/faers/brands.py
    outs:
      - data/reference/drug-ndc.json.zip:
          # Re-fetchable from FDA and pinned by the checksum in brands_stats.json, like the
          # quarterly archives.
          cache: false
          persist: true
      - data/reference/ndc_brand_index.parquet
    metrics:
      - results/brands_stats.json:
          cache: false

  normalize:
    desc: Resolve reported drug names to ingredients via prod_ai, the corpus, NDC and RxNav.
    cmd: python -m faers.cli normalize
    deps:
      - data/curated/drug.parquet
      - data/reference/ndc_brand_index.parquet
      - src/faers/normalize.py
      - src/faers/brands.py
    params:
      - normalize
    outs:
      - data/curated/drug_ingredients.parquet
      - data/reference/rxnav_cache.json:
          # Cached RxNav answers, negatives included. Kept out of the DVC cache so a re-run tops it
          # up rather than re-querying NLM for thousands of names it has already answered.
          cache: false
          persist: true
      - data/reference/rxcui_cache.json:
          cache: false
          persist: true
    metrics:
      - results/normalize_stats.json:
          cache: false

  describe:
    desc: Corpus description - growth, demographics, reporters, top terms, report structure.
    cmd: python -m faers.cli describe
    deps:
      - data/curated/demo.parquet
      - data/curated/drug_ingredients.parquet
      - data/curated/reac.parquet
      - data/curated/outc.parquet
      - data/curated/indi.parquet
      - src/faers/stats/descriptive.py
    params:
      - descriptive
    outs:
      - results/descriptive

  signals:
    desc: Drug-event contingency tables scored with ROR, PRR, IC/BCPNN and EBGM/MGPS.
    cmd: python -m faers.cli signals
    deps:
      - data/curated/demo.parquet
      - data/curated/drug_ingredients.parquet
      - data/curated/reac.parquet
      - src/faers/signals.py
      - src/faers/stats/disproportionality.py
    params:
      - signals
    outs:
      - results/signals/counts.parquet
      - results/signals/scored.parquet
    metrics:
      - results/signals/summary.json:
          cache: false
      - results/signals/fanout.json:
          cache: false

  stratify:
    desc: Mantel-Haenszel adjustment for sex, age band and calendar period, with Breslow-Day.
    cmd: python -m faers.cli stratify
    deps:
      - data/curated/demo.parquet
      - data/curated/drug_ingredients.parquet
      - data/curated/reac.parquet
      - results/signals/scored.parquet
      - src/faers/stats/stratified.py
    params:
      - stratify
      - signals
    outs:
      - results/stratified
    metrics:
      - results/stratify_summary.json:
          cache: false

  duplicates:
    desc: Estimate independent duplicate reports (same incident, different case ids).
    cmd: python -m faers.cli duplicates
    deps:
      - data/curated/demo.parquet
      - data/curated/drug_ingredients.parquet
      - data/curated/reac.parquet
      - src/faers/duplicates.py
    params:
      - duplicates
    outs:
      - results/duplicates
    metrics:
      - results/duplicates_summary.json:
          cache: false

  drift:
    desc: Flag reaction terms whose trajectory looks like MedDRA vocabulary change.
    cmd: python -m faers.cli drift
    deps:
      - data/curated/reac.parquet
      - data/curated/demo.parquet
      - src/faers/stats/drift.py
    outs:
      - results/drift
    metrics:
      - results/drift_summary.json:
          cache: false

  figures:
    desc: Render every figure as a Vega-Lite spec plus a PNG.
    cmd: python -m faers.cli figures
    deps:
      - results/descriptive
      - results/signals/scored.parquet
      - results/stratified
      - results/drift
      - src/faers/plots.py
    outs:
      - figures:
          cache: false

  report:
    desc: Render the Quarto report.
    cmd: python -m faers.cli report
    deps:
      - figures
      - results/descriptive
      - results/signals/summary.json
      - results/dedup_stats.json
      - results/normalize_stats.json
      - report/index.qmd
      - report/_quarto.yml
    outs:
      - docs:
          # Served directly by GitHub Pages from the master branch, so it must be git-tracked
          # rather than DVC-cached.
          cache: false
