[project]
name = "faers"
version = "2.0.0"
description = "Reproducible DVC pipeline over the complete FDA FAERS/LAERS adverse event corpus, 2004Q1-2026Q2"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexander Goncearenco" }]

dependencies = [
    "polars>=1.17",
    "duckdb>=1.1",
    "pyarrow>=18",
    "numpy>=2.0",
    "scipy>=1.14",
    "pandas>=2.2",
    "requests>=2.32",
    "typer>=0.15",
    "pyyaml>=6.0",
    "altair>=5.5",
    "vl-convert-python>=1.7",
    "huggingface-hub>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
faers = "faers.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
